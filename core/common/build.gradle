plugins {
    id 'multiloader-common'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

minecraft {
    version(minecraft_version)
    // Automatically enable AccessWideners if the file exists
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWideners(aw)
    }
}

dependencies {
    // The numen-api engine (project dependency on the in-repo api/ tree). compileOnly:
    // the api classes are provided at runtime by the numen-api mod, not bundled.
    compileOnly project(':api:common')
    // 单元测试要真的跑到引擎类(排程机器随 api),运行时类路径补上同一模块。
    testImplementation project(':api:common')
    // 平台服务的测试替身（TestPlatformHelper）随 api:common 的 test 源集发一份 test-support jar：
    // ApiLintReport 会走 NumenCore.init() → NumenPaths.config()，纯 JUnit 里没有加载器提供的服务。
    testImplementation project(path: ':api:common', configuration: 'testSupport')
    // 命名地点是引擎级 API 组（不属于任何外部模组），入口在 plugins:places。
    // 与 api 同理：compileOnly，类由发行 jar 平铺进去。
    compileOnly project(':plugins:places')
    // 常驻订阅（numen.watch）同理：引擎级 API 组，入口在 plugins:watch。
    compileOnly project(':plugins:watch')
    // 但 core 的 ApiLintReport 测试会把全树的组过一遍，places/watch 的类在运行时得真在场。
    // 只要 main 的输出目录（classes + resources），不要它们的 jar：numen-plugin.gradle 会把 core 的测试
    // 运行时类路径拼到每个插件测试的最前面，而这两个 jar 里带着 plugins/*/skills 资源——类路径上先命中
    // jar 条目，插件的 ApiLintReport 就会拿 Path.of(jar:...) 抛 FileSystemNotFoundException。
    // 写成闭包是惰性的：core 比 plugins 先求值，配置期拿不到它们的 sourceSets。
    testImplementation files { project(':plugins:places').sourceSets.main.output }
    testImplementation files { project(':plugins:watch').sourceSets.main.output }

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

// 服务端安全门:numen-core 的 common 全部是服务端代码(工具/任务/寻路/
// 建造),客户端半边住在 numen-api。common 编译用的是合并的客户端 MC jar,
// 手滑 import 一个 net.minecraft.client 编译器照样放行、专用服务端上
// ClassNotFound——这道检查让它在构建期就 fail。将来真要在本仓写客户端
// 代码,参照 numen-api 的做法建 src/client/java 源码集,而不是放进 main。
tasks.register('checkServerSafe') {
    group = 'verification'
    description = 'Fail if src/main references Minecraft client-only classes.'
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    outputs.upToDateWhen { false }
    doLast {
        def offenders = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            int no = 0
            f.eachLine('UTF-8') { line ->
                no++
                if (line.contains('net.minecraft.client') || line.contains('com.mojang.blaze3d')) {
                    offenders << "${f}:${no}: ${line.trim()}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "src/main 引用了 Minecraft 客户端类(专用服务端上不存在,会 ClassNotFound)。\n"
                    + "numen-core 的 common 应保持纯服务端;客户端功能归 numen-api:\n  "
                    + offenders.join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn 'checkServerSafe' }
